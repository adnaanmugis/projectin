<!DOCTYPE html>

<html>

<head>

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <h3 class="text-white">

                Admin Dashboard

            </h3>

        </div>

    </nav>

    <div class="container mt-5">

        <div class="card p-4">

            <h4>

                Upload Study Note

            </h4>

            <form id="uploadForm">

                <input class="form-control mt-2" name="title" placeholder="Title">

                <input class="form-control mt-2" name="subject" placeholder="Subject">

                <textarea class="form-control mt-2" name="description">

</textarea>

                <input type="file" class="form-control mt-2" name="pdf">

                <button class="btn btn-success mt-3">

                    Upload

                </button>

            </form>

        </div>

    </div>

    <script src="js/admin.js"></script>

</body>

</html>

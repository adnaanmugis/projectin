<!DOCTYPE html>

<html>

<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <h3 class="text-white">

                EduConnect Dashboard

            </h3>

        </div>

    </nav>

    <input type="text" class="form-control mb-3" id="search" placeholder="Search Notes">
    <div class="container mt-5">

        <div class="row">

            <div class="col-md-4">

                <div class="card p-4">

                    <h4>

                        Study Notes

                    </h4>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4">

                    <h4>

                        Videos

                    </h4>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4">

                    <h4>

                        Quiz

                    </h4>

                </div>

            </div>

        </div>

    </div>

    <div class="row text-center mb-4">

        <div class="col-md-4">

            <div class="card p-3">

                <h2>120</h2>

                <p>Students</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h2>45</h2>

                <p>Notes</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h2>30</h2>

                <p>Videos</p>

            </div>

        </div>



    </div>

    <h2 class="text-center mt-4">

        Available Notes

    </h2>

    <div class="container" id="notes">

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
